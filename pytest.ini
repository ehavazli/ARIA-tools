# pytest.ini – Configuration for running ARIA-tools test suite
[pytest]
minversion = 6.0

# Additional command-line options applied by default
addopts = -ra --tb=short --strict-markers

# Where pytest should look for test files
testpaths =
    tests

# What files, classes, and functions to consider as tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Enable live logging to stdout
log_cli = true
log_cli_level = INFO

